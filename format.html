<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Image Resizer & Cropper | Smart Mobile Toolkit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .img-container { max-height: 400px; width: 100%; margin-bottom: 20px; background: #111; border-radius: 8px; overflow: hidden; }
        img { display: block; max-width: 100%; }
        .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h2 class="text-center mb-4"><i class="fa-solid fa-crop-simple"></i> Pro Image Resizer</h2>
        
        <input type="file" id="imageInput" class="form-control mb-3" accept="image/*">
        
        <div class="img-container" id="cropContainer" style="display: none;">
            <img id="image" src="">
        </div>

        <div id="editorControls" style="display: none;">
            <div class="controls-grid mb-3">
                <div>
                    <label>Width (px)</label>
                    <input type="number" id="outWidth" class="form-control" placeholder="e.g., 213 (PAN)">
                </div>
                <div>
                    <label>Height (px)</label>
                    <input type="number" id="outHeight" class="form-control" placeholder="e.g., 213 (PAN)">
                </div>
                <div>
                    <label>Quality (%)</label>
                    <input type="range" id="outQuality" class="form-range" min="0.1" max="1" step="0.1" value="0.8">
                </div>
                <div>
                    <label>Format</label>
                    <select id="outFormat" class="form-select">
                        <option value="image/jpeg">JPEG / JPG</option>
                        <option value="image/png">PNG</option>
                        <option value="image/webp">WEBP</option>
                    </select>
                </div>
            </div>
            
            <button id="processBtn" class="btn btn-primary w-100"><i class="fa-solid fa-download"></i> Crop, Resize & Download</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script>
        let cropper;
        const image = document.getElementById('image');
        const imageInput = document.getElementById('imageInput');
        
        imageInput.addEventListener('change', (e) => {
            const files = e.target.files;
            if (files && files.length > 0) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    image.src = event.target.result;
                    document.getElementById('cropContainer').style.display = 'block';
                    document.getElementById('editorControls').style.display = 'block';
                    
                    if (cropper) cropper.destroy();
                    cropper = new Cropper(image, {
                        viewMode: 1,
                        background: false,
                        zoomable: true,
                    });
                };
                reader.readAsDataURL(files[0]);
            }
        });

        document.getElementById('processBtn').addEventListener('click', () => {
            if (!cropper) return;
            
            const width = parseInt(document.getElementById('outWidth').value) || undefined;
            const height = parseInt(document.getElementById('outHeight').value) || undefined;
            const format = document.getElementById('outFormat').value;
            const quality = parseFloat(document.getElementById('outQuality').value);

            // 1. Get the cropped canvas
            const croppedCanvas = cropper.getCroppedCanvas({
                width: width,
                height: height,
                imageSmoothingEnabled: true,
                imageSmoothingQuality: 'high',
            });

            // 2. Convert to the requested format, quality, and trigger download
            croppedCanvas.toBlob((blob) => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `edited_image_${Date.now()}.${format.split('/')[1]}`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, format, quality);
        });
    </script>
</body>
</html>
