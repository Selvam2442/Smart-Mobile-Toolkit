<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced PDF Manager | Smart Mobile Toolkit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0a0a0f; color: #fff; }
        .upload-zone { border: 2px dashed #145054; border-radius: 12px; padding: 30px; text-align: center; cursor: pointer; background: #081214; }
        .pdf-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; margin-top: 20px; }
        .page-card { background: #1a1a24; padding: 10px; border-radius: 8px; text-align: center; border: 1px solid #333; }
        .page-card canvas { max-width: 100%; border: 1px solid #555; border-radius: 4px; transition: transform 0.3s; }
        .deleted canvas { opacity: 0.2; filter: grayscale(100%); }
    </style>
</head>
<body>
    <div class="container mt-4 pb-5">
        <h2 class="mb-4 fw-bold"><i class="fa-solid fa-file-pdf text-danger"></i> PDF Manager Pro</h2>
        
        <div class="upload-zone mb-4" onclick="document.getElementById('fileInput').click()">
            <i class="fa-solid fa-plus fs-1 text-info mb-2"></i>
            <h5>Add PDF or Images</h5>
            <p class="text-secondary small mb-0">You can add multiple files. They will be appended.</p>
            <input type="file" id="fileInput" accept="application/pdf, image/jpeg, image/png" multiple hidden>
        </div>

        <div id="workspace" style="display: none;">
            <div class="d-flex justify-content-between align-items-center bg-dark p-3 rounded border border-secondary mb-3">
                <span id="pageCount">0 Pages Loaded</span>
                <button id="exportBtn" class="btn btn-success"><i class="fa-solid fa-download"></i> Export PDF</button>
            </div>
            <div class="pdf-grid" id="pagesGrid"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        
        let pagesData = []; // Array of { type: 'pdf'|'image', bytes/file, pageIndex, rotation, deleted, elementId }
        let globalId = 0;

        document.getElementById('fileInput').addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            document.getElementById('workspace').style.display = 'block';
            
            for (let file of files) {
                if (file.type === 'application/pdf') {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        addPageToUI(page, false, arrayBuffer, i - 1);
                    }
                } else {
                    addPageToUI(file, true, file, 0);
                }
            }
        });

        async function addPageToUI(source, isImage, rawData, originalIndex) {
            const id = globalId++;
            pagesData.push({ id, isImage, rawData, originalIndex, rotation: 0, deleted: false });
            
            const grid = document.getElementById('pagesGrid');
            const card = document.createElement('div');
            card.className = 'page-card';
            card.id = `card-${id}`;
            
            const canvas = document.createElement('canvas');
            canvas.id = `canvas-${id}`;
            card.appendChild(canvas);

            if (!isImage) {
                const viewport = source.getViewport({ scale: 0.5 });
                canvas.width = viewport.width; canvas.height = viewport.height;
                await source.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
            } else {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        canvas.width = img.width; canvas.height = img.height;
                        canvas.getContext('2d').drawImage(img, 0, 0);
                    };
                };
                reader.readAsDataURL(source);
            }

            card.innerHTML += `
                <div class="d-flex justify-content-center gap-2 mt-2">
                    <button class="btn btn-sm btn-outline-info" onclick="rotatePage(${id})"><i class="fa-solid fa-rotate-right"></i></button>
                    <button class="btn btn-sm btn-outline-danger" onclick="toggleDelete(${id})"><i class="fa-solid fa-trash"></i></button>
                </div>
            `;
            grid.appendChild(card);
            document.getElementById('pageCount').innerText = `${pagesData.filter(p => !p.deleted).length} Pages`;
        }

        window.rotatePage = (id) => {
            const page = pagesData.find(p => p.id === id);
            if (page.deleted) return;
            page.rotation = (page.rotation + 90) % 360;
            document.getElementById(`canvas-${id}`).style.transform = `rotate(${page.rotation}deg)`;
        };

        window.toggleDelete = (id) => {
            const page = pagesData.find(p => p.id === id);
            page.deleted = !page.deleted;
            document.getElementById(`card-${id}`).classList.toggle('deleted');
            document.getElementById('pageCount').innerText = `${pagesData.filter(p => !p.deleted).length} Pages`;
        };

        document.getElementById('exportBtn').addEventListener('click', async () => {
            const { PDFDocument, degrees } = PDFLib;
            const newPdf = await PDFDocument.create();
            
            // Cache loaded PDFs to avoid re-parsing
            const loadedPdfs = new Map();

            for (let page of pagesData) {
                if (page.deleted) continue;

                if (!page.isImage) {
                    if (!loadedPdfs.has(page.rawData)) {
                        loadedPdfs.set(page.rawData, await PDFDocument.load(page.rawData));
                    }
                    const srcPdf = loadedPdfs.get(page.rawData);
                    const [copiedPage] = await newPdf.copyPages(srcPdf, [page.originalIndex]);
                    copiedPage.setRotation(degrees(copiedPage.getRotation().angle + page.rotation));
                    newPdf.addPage(copiedPage);
                } else {
                    const arrayBuffer = await page.rawData.arrayBuffer();
                    let img = page.rawData.type === 'image/jpeg' ? await newPdf.embedJpg(arrayBuffer) : await newPdf.embedPng(arrayBuffer);
                    const newPage = newPdf.addPage([img.width, img.height]);
                    newPage.drawImage(img, { x: 0, y: 0, width: img.width, height: img.height });
                    newPage.setRotation(degrees(page.rotation));
                }
            }

            const pdfBytes = await newPdf.save();
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([pdfBytes], { type: 'application/pdf' }));
            a.download = `Merged_Document_${Date.now()}.pdf`;
            a.click();
        });
    </script>
</body>
</html>
