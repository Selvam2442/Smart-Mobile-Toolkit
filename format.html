<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Format Converter - Toolkit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <div class="tool-header">
            <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
            <h2 class="m-0">Image Converter</h2>
            <button class="info-btn" data-bs-toggle="modal" data-bs-target="#infoModal"><i class="fa-solid fa-info"></i></button>
        </div>
        
        <div class="tool-panel">
            <div class="input-group">
                <label>Upload Image File</label>
                <input type="file" id="image-file" class="styled-input" accept="image/*" style="padding: 10px;">
            </div>

            <div class="input-group">
                <label>Convert To</label>
                <select id="format-select" class="styled-select">
                    <option value="image/jpeg">JPEG (.jpg)</option>
                    <option value="image/png">PNG (.png)</option>
                    <option value="image/webp">WEBP (.webp)</option>
                </select>
            </div>

            <canvas id="canvas" style="display: none;"></canvas>
            
            <button id="btn-convert" class="btn custom-btn w-100 mt-2"><i class="fa-solid fa-arrows-rotate"></i> CONVERT FORMAT</button>
            <a id="download-link" class="btn custom-btn btn-secondary w-100 mt-3" style="display: none; text-decoration: none;"><i class="fa-solid fa-download"></i> DOWNLOAD IMAGE</a>
        </div>
    </div>

    <div class="modal fade" id="infoModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fa-solid fa-file-image"></i> Image Format Converter</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p>Instantly convert images between formats completely offline using HTML5 Canvas technology.</p>
                    <ul>
                        <li><i class="fa-solid fa-upload"></i> Upload your image (PNG, JPG, WEBP).</li>
                        <li><i class="fa-solid fa-caret-down"></i> Select your desired output format.</li>
                        <li><i class="fa-solid fa-bolt"></i> Click convert and download instantly with zero quality loss!</li>
                    </ul>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn custom-btn btn-secondary w-100 m-0" data-bs-dismiss="modal">GOT IT</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const fileInput = document.getElementById('image-file');
            const formatSelect = document.getElementById('format-select');
            const btnConvert = document.getElementById('btn-convert');
            const downloadLink = document.getElementById('download-link');
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');

            btnConvert.addEventListener('click', () => {
                if (!fileInput.files[0]) return alert("Please select an image file first.");
                
                const file = fileInput.files[0];
                const reader = new FileReader();
                
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        // Draw image to canvas
                        canvas.width = img.width;
                        canvas.height = img.height;
                        ctx.drawImage(img, 0, 0);

                        // Export to new format
                        const targetFormat = formatSelect.value;
                        const extension = targetFormat.split('/')[1];
                        
                        const dataUrl = canvas.toDataURL(targetFormat, 1.0);
                        
                        downloadLink.href = dataUrl;
                        downloadLink.download = `converted_image.${extension}`;
                        downloadLink.style.display = "flex";
                        btnConvert.innerHTML = '<i class="fa-solid fa-check"></i> CONVERSION COMPLETE';
                    }
                    img.src = event.target.result;
                }
                reader.readAsDataURL(file);
            });
        });
    </script>
</body>
</html>
