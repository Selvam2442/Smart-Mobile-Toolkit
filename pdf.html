<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced PDF Manager | Smart Mobile Toolkit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .pdf-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; margin-top: 20px; }
        .page-card { background: #222; padding: 10px; border-radius: 8px; text-align: center; position: relative; }
        .page-card canvas { max-width: 100%; height: auto; border: 1px solid #444; border-radius: 4px; transition: transform 0.3s; }
        .page-controls { display: flex; justify-content: center; gap: 10px; margin-top: 10px; }
        .deleted canvas { opacity: 0.3; filter: grayscale(100%); }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h2 class="text-center mb-4"><i class="fa-solid fa-file-pdf"></i> PDF Manager Pro</h2>
        
        <div class="card p-3 mb-4" style="background: #1a1a1a; border: 1px solid #333;">
            <label class="form-label">Upload PDF or Images (to convert):</label>
            <input type="file" id="fileInput" class="form-control" accept="application/pdf, image/jpeg, image/png" multiple>
        </div>

        <div id="pdfWorkspace" style="display: none;">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4>Pages Preview</h4>
                <button id="exportBtn" class="btn btn-success"><i class="fa-solid fa-download"></i> Save Final PDF</button>
            </div>
            <div class="pdf-grid" id="pagesGrid"></div>
        </div>
    </div>

    <!-- Load pdf.js for rendering and pdf-lib for manipulation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        
        let loadedPdfDoc = null;
        let pageStates = []; // Tracks rotation and deletion
        let isImageMode = false;
        let imageFiles = [];

        document.getElementById('fileInput').addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            document.getElementById('pagesGrid').innerHTML = '';
            pageStates = [];
            document.getElementById('pdfWorkspace').style.display = 'block';

            if (files[0].type === 'application/pdf') {
                isImageMode = false;
                const arrayBuffer = await files[0].arrayBuffer();
                loadedPdfDoc = await PDFLib.PDFDocument.load(arrayBuffer);
                renderPdfPreview(arrayBuffer);
            } else {
                isImageMode = true;
                imageFiles = files;
                renderImagePreviews(files);
            }
        });

        async function renderPdfPreview(arrayBuffer) {
            const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
            for (let i = 1; i <= pdf.numPages; i++) {
                pageStates.push({ deleted: false, rotation: 0 });
                const page = await pdf.getPage(i);
                createPageCard(page, i - 1, false);
            }
        }

        function renderImagePreviews(files) {
            files.forEach((file, index) => {
                pageStates.push({ deleted: false, rotation: 0 });
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => createPageCard(img, index, true);
                };
                reader.readAsDataURL(file);
            });
        }

        async function createPageCard(source, index, isImage) {
            const grid = document.getElementById('pagesGrid');
            const card = document.createElement('div');
            card.className = 'page-card';
            card.id = `page-card-${index}`;
            
            const canvas = document.createElement('canvas');
            canvas.id = `canvas-${index}`;
            
            if (!isImage) {
                const viewport = source.getViewport({ scale: 0.5 });
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                await source.render({ canvasContext: canvas.getContext('2d'), viewport: viewport }).promise;
            } else {
                canvas.width = source.width;
                canvas.height = source.height;
                canvas.getContext('2d').drawImage(source, 0, 0);
            }

            const controls = document.createElement('div');
            controls.className = 'page-controls';
            controls.innerHTML = `
                <button class="btn btn-sm btn-outline-warning" onclick="rotatePage(${index})"><i class="fa-solid fa-rotate-right"></i></button>
                <button class="btn btn-sm btn-outline-danger" onclick="toggleDelete(${index})"><i class="fa-solid fa-trash"></i></button>
            `;

            card.appendChild(canvas);
            card.appendChild(controls);
            grid.appendChild(card);
        }

        window.rotatePage = (index) => {
            if (pageStates[index].deleted) return;
            pageStates[index].rotation = (pageStates[index].rotation + 90) % 360;
            document.getElementById(`canvas-${index}`).style.transform = `rotate(${pageStates[index].rotation}deg)`;
        };

        window.toggleDelete = (index) => {
            pageStates[index].deleted = !pageStates[index].deleted;
            document.getElementById(`page-card-${index}`).classList.toggle('deleted');
        };

        document.getElementById('exportBtn').addEventListener('click', async () => {
            const { PDFDocument, degrees } = PDFLib;
            const newPdf = await PDFDocument.create();

            if (!isImageMode) {
                const copiedPages = await newPdf.copyPages(loadedPdfDoc, loadedPdfDoc.getPageIndices());
                copiedPages.forEach((page, index) => {
                    if (!pageStates[index].deleted) {
                        page.setRotation(degrees(page.getRotation().angle + pageStates[index].rotation));
                        newPdf.addPage(page);
                    }
                });
            } else {
                for (let i = 0; i < imageFiles.length; i++) {
                    if (pageStates[i].deleted) continue;
                    const arrayBuffer = await imageFiles[i].arrayBuffer();
                    let img;
                    if (imageFiles[i].type === 'image/jpeg') img = await newPdf.embedJpg(arrayBuffer);
                    else img = await newPdf.embedPng(arrayBuffer);
                    
                    const page = newPdf.addPage([img.width, img.height]);
                    page.drawImage(img, { x: 0, y: 0, width: img.width, height: img.height });
                    page.setRotation(degrees(pageStates[i].rotation));
                }
            }

            const pdfBytes = await newPdf.save();
            const blob = new Blob([pdfBytes], { type: 'application/pdf' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `Toolkit_Export_${Date.now()}.pdf`;
            link.click();
        });
    </script>
</body>
</html>
