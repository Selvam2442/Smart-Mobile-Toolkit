<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Converter - Toolkit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <div class="tool-header">
            <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
            <h2 class="m-0">Number Converter</h2>
            <button class="info-btn" data-bs-toggle="modal" data-bs-target="#infoModal"><i class="fa-solid fa-info"></i></button>
        </div>
        
        <div class="tool-panel">
            <div class="input-group">
                <label>Convert From</label>
                <div class="converter-box">
                    <input type="number" id="input-value" class="styled-input" style="flex: 1.5;" value="1" min="0">
                    <select id="input-unit" class="styled-select" style="flex: 2;"></select>
                </div>
            </div>

            <button id="btn-swap" class="swap-btn" title="Swap Units"><i class="fa-solid fa-arrows-up-down"></i></button>

            <div class="input-group">
                <label>Converted To</label>
                <div class="converter-box">
                    <input type="number" id="output-value" class="styled-input" style="flex: 1.5; color: var(--primary-glow); font-weight: 800;" readonly>
                    <select id="output-unit" class="styled-select" style="flex: 2;"></select>
                </div>
            </div>
            
        </div>
    </div>

    <div class="modal fade" id="infoModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fa-solid fa-hashtag"></i> Number System Converter</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p>It can be very confusing to translate Western numbers (Millions/Billions) into Indian numbers (Lakhs/Crores). This tool does the math for you instantly.</p>
                    <ul>
                        <li><i class="fa-solid fa-arrow-right-arrow-left"></i> <strong>Translate:</strong> Easily convert "100 Million" into "10 Crores".</li>
                    </ul>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn custom-btn btn-secondary w-100 m-0" data-bs-dismiss="modal">GOT IT</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const inputUnit = document.getElementById('input-unit'), outputUnit = document.getElementById('output-unit');
            const inputValue = document.getElementById('input-value'), outputValue = document.getElementById('output-value');
            const btnSwap = document.getElementById('btn-swap');

            // Exact Multipliers for calculation
            const unitsData = {
                "Unit / Exact Number": 1,
                "Thousand (K)": 1000,
                "Lakh": 100000,
                "Million (M)": 1000000,
                "Crore (Cr)": 10000000,
                "Billion (B)": 1000000000,
                "Trillion (T)": 1000000000000
            };

            function populateDropdowns() {
                const options = Object.keys(unitsData);
                options.forEach(opt => {
                    inputUnit.innerHTML += `<option value="${opt}">${opt}</option>`;
                    outputUnit.innerHTML += `<option value="${opt}">${opt}</option>`;
                });
                // Default: Million to Crore
                inputUnit.value = "Million (M)";
                outputUnit.value = "Crore (Cr)";
                calculate();
            }

            function calculate() {
                const val = parseFloat(inputValue.value);
                if (isNaN(val) || val < 0) { 
                    outputValue.value = ""; 
                    return; 
                }

                const fromRate = unitsData[inputUnit.value];
                const toRate = unitsData[outputUnit.value];
                
                const exactValue = val * fromRate;
                let res = exactValue / toRate;
                
                res = parseFloat(res.toPrecision(10));
                outputValue.value = res;
            }

            btnSwap.addEventListener('click', () => {
                const temp = inputUnit.value;
                inputUnit.value = outputUnit.value;
                outputUnit.value = temp;
                calculate();
            });

            [inputValue, inputUnit, outputUnit].forEach(el => el.addEventListener('input', calculate));
            populateDropdowns();
        });
    </script>
</body>
</html>
