<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>Photo Studio - Online Image Editor & Filters | Smart Mobile Toolkit</title>
    <meta name="description" content="Edit photos online offline. Apply filters, crop, rotate, flip, adjust brightness and contrast directly in your browser.">
    <meta name="keywords" content="photo studio, image editor, photo crop, image filters, photo rotate, online picture editor">
    <meta name="author" content="Maria Antony Selvam S">
    <link rel="canonical" href="https://alaneditxz.online/studio.html">
    <meta property="og:title" content="Photo Studio - Online Image Editor & Filters | Smart Mobile Toolkit">
    <meta property="og:description" content="Edit photos online offline. Apply filters, crop, rotate, flip, adjust brightness and contrast directly in your browser.">
    <meta property="og:url" content="https://alaneditxz.online/studio.html">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg glass-navbar fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <img src="logo.svg" alt="Logo" style="width: 35px; height: 35px; border-radius: 8px;"> Toolkit
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="index.html"><i class="fa-solid fa-house"></i> Home</a></li>
                    <li class="nav-item">
                        <button class="nav-link bg-transparent border-0" data-bs-toggle="modal" data-bs-target="#globalSearchModal" style="cursor: pointer;">
                            <i class="fa-solid fa-magnifying-glass"></i> Search
                        </button>
                    </li>
                    <li class="nav-item"><a class="nav-link" href="about.html"><i class="fa-solid fa-circle-info"></i> About</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="app-container">
        <div class="tool-header">
            <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
            <div>
                <h2>Photo Studio</h2>
                <span class="tool-subtitle">Apply pro filters & transformations</span>
            </div>
            <button class="info-btn" data-bs-toggle="modal" data-bs-target="#infoModal"><i class="fa-solid fa-info"></i></button>
        </div>

        <div class="tool-panel">
            <div class="upload-zone" onclick="document.getElementById('uploadImg').click()">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
                <h4 class="fw-bold text-white mb-1">Load Image</h4>
                <p class="text-secondary small mb-0">Apply adjustments safely</p>
                <input type="file" id="uploadImg" accept="image/*" hidden>
            </div>

            <div class="action-panel mt-4" id="controls">
                <div class="canvas-container" style="display: block; background: #000; padding: 0;">
                    <canvas id="canvas" style="max-width: 100%; max-height: 40vh; border-radius: 12px;"></canvas>
                </div>

                <div class="mode-tabs justify-content-center mt-3 mb-4">
                    <button class="mode-tab" onclick="transform('rotate', -90)"><i class="fa-solid fa-rotate-left"></i> Left</button>
                    <button class="mode-tab" onclick="transform('rotate', 90)"><i class="fa-solid fa-rotate-right"></i> Right</button>
                    <button class="mode-tab" onclick="transform('flipX')"><i class="fa-solid fa-arrows-left-right"></i> Flip H</button>
                    <button class="mode-tab" onclick="transform('flipY')"><i class="fa-solid fa-arrows-up-down"></i> Flip V</button>
                </div>

                <div class="settings-grid mb-4">
                    <div class="slider-group">
                        <label>Brightness <span><span id="v-bright">100</span>%</span></label>
                        <input type="range" class="f-slider" id="bright" min="0" max="200" value="100">
                    </div>
                    <div class="slider-group">
                        <label>Contrast <span><span id="v-contrast">100</span>%</span></label>
                        <input type="range" class="f-slider" id="contrast" min="0" max="200" value="100">
                    </div>
                    <div class="slider-group">
                        <label>Saturation <span><span id="v-saturate">100</span>%</span></label>
                        <input type="range" class="f-slider" id="saturate" min="0" max="200" value="100">
                    </div>
                    <div class="slider-group">
                        <label>Hue Rotate <span><span id="v-hue">0</span>°</span></label>
                        <input type="range" class="f-slider" id="hue" min="0" max="360" value="0">
                    </div>
                    <div class="slider-group">
                        <label>Sepia <span><span id="v-sepia">0</span>%</span></label>
                        <input type="range" class="f-slider" id="sepia" min="0" max="100" value="0">
                    </div>
                    <div class="slider-group">
                        <label>Blur <span><span id="v-blur">0</span>px</span></label>
                        <input type="range" class="f-slider" id="blur" min="0" max="20" value="0">
                    </div>
                </div>
                
                <button class="btn custom-btn w-100" id="downloadBtn"><i class="fa-solid fa-download"></i> Save Masterpiece</button>
            </div>
        </div>
    </main>

    <!-- Info Modal -->
    <div class="modal fade" id="infoModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fa-solid fa-circle-info"></i> Tool Info</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>Edit images like a pro, entirely in your browser.</p>
                    <ul>
                        <li><i class="fa-solid fa-check"></i> Advanced CSS/Canvas filtering.</li>
                        <li><i class="fa-solid fa-check"></i> Non-destructive rotations and flips.</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <footer><p><i class="fa-solid fa-code"></i> Created by Antony</p></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let img = new Image();
        let currentTransform = { rotate: 0, flipX: 1, flipY: 1 };

        document.getElementById('uploadImg').addEventListener('change', (e) => {
            if (e.target.files[0]) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    img.src = event.target.result;
                    img.onload = () => {
                        currentTransform = { rotate: 0, flipX: 1, flipY: 1 };
                        document.querySelector('.upload-zone').style.display = 'none';
                        document.getElementById('controls').classList.add('active');
                        applyRender();
                    };
                };
                reader.readAsDataURL(e.target.files[0]);
            }
        });

        document.querySelectorAll('.f-slider').forEach(slider => {
            slider.addEventListener('input', () => {
                document.getElementById(`v-${slider.id}`).innerText = slider.value;
                applyRender();
            });
        });

        window.transform = (type, val) => {
            if (type === 'rotate') currentTransform.rotate = (currentTransform.rotate + val) % 360;
            if (type === 'flipX') currentTransform.flipX *= -1;
            if (type === 'flipY') currentTransform.flipY *= -1;
            applyRender();
        };

        function applyRender() {
            const { rotate, flipX, flipY } = currentTransform;
            if (rotate % 180 !== 0) { canvas.width = img.height; canvas.height = img.width; } 
            else { canvas.width = img.width; canvas.height = img.height; }

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.rotate(rotate * Math.PI / 180);
            ctx.scale(flipX, flipY);

            const b = document.getElementById('bright').value, c = document.getElementById('contrast').value;
            const s = document.getElementById('saturate').value, bl = document.getElementById('blur').value;
            const sp = document.getElementById('sepia').value, h = document.getElementById('hue').value;
            ctx.filter = `brightness(${b}%) contrast(${c}%) saturate(${s}%) blur(${bl}px) sepia(${sp}%) hue-rotate(${h}deg)`;

            ctx.drawImage(img, -img.width / 2, -img.height / 2);
            ctx.restore();
        }

        document.getElementById('downloadBtn').addEventListener('click', () => {
            const a = document.createElement('a');
            a.download = `Studio_${Date.now()}.png`;
            a.href = canvas.toDataURL('image/png');
            a.click();
        });
    </script>
    <script src="global-search.js"></script>
</body>
</html>
