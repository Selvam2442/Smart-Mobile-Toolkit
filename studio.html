<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Photo Studio | Smart Mobile Toolkit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0a0a0f; color: #fff; }
        .canvas-container { width: 100%; max-height: 45vh; overflow: hidden; display: flex; justify-content: center; align-items: center; background: #000; border-radius: 8px; margin-bottom: 20px; border: 1px solid #333; }
        canvas { max-width: 100%; max-height: 45vh; object-fit: contain; }
        .filter-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .filter-label { font-size: 0.8rem; color: #aaa; display: flex; justify-content: space-between; }
    </style>
</head>
<body>
    <div class="container mt-4 pb-5">
        <h2 class="mb-4 fw-bold"><i class="fa-solid fa-wand-magic-sparkles text-warning"></i> Photo Studio</h2>
        
        <input type="file" id="uploadImg" class="form-control bg-dark text-white mb-3" accept="image/*">
        
        <div class="canvas-container" id="canvasWrapper" style="display: none;">
            <canvas id="canvas"></canvas>
        </div>

        <div id="controls" style="display: none;">
            <div class="d-flex gap-2 justify-content-center mb-4">
                <button class="btn btn-dark border-secondary" onclick="transform('rotate', -90)"><i class="fa-solid fa-rotate-left"></i></button>
                <button class="btn btn-dark border-secondary" onclick="transform('rotate', 90)"><i class="fa-solid fa-rotate-right"></i></button>
                <button class="btn btn-dark border-secondary" onclick="transform('flipX')"><i class="fa-solid fa-arrows-left-right"></i></button>
                <button class="btn btn-dark border-secondary" onclick="transform('flipY')"><i class="fa-solid fa-arrows-up-down"></i></button>
            </div>

            <div class="filter-grid mb-4">
                <div><div class="filter-label"><span>Brightness</span> <span id="v-bright">100%</span></div><input type="range" class="form-range f-slider" id="bright" min="0" max="200" value="100"></div>
                <div><div class="filter-label"><span>Contrast</span> <span id="v-contrast">100%</span></div><input type="range" class="form-range f-slider" id="contrast" min="0" max="200" value="100"></div>
                <div><div class="filter-label"><span>Saturation</span> <span id="v-saturate">100%</span></div><input type="range" class="form-range f-slider" id="saturate" min="0" max="200" value="100"></div>
                <div><div class="filter-label"><span>Blur</span> <span id="v-blur">0px</span></div><input type="range" class="form-range f-slider" id="blur" min="0" max="20" value="0"></div>
                <div><div class="filter-label"><span>Sepia</span> <span id="v-sepia">0%</span></div><input type="range" class="form-range f-slider" id="sepia" min="0" max="100" value="0"></div>
                <div><div class="filter-label"><span>Hue</span> <span id="v-hue">0°</span></div><input type="range" class="form-range f-slider" id="hue" min="0" max="360" value="0"></div>
            </div>
            
            <button class="btn btn-info w-100 fw-bold" id="downloadBtn"><i class="fa-solid fa-download"></i> Save Image</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let img = new Image();
        let currentTransform = { rotate: 0, flipX: 1, flipY: 1 };

        document.getElementById('uploadImg').addEventListener('change', (e) => {
            if (e.target.files[0]) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    img.src = event.target.result;
                    img.onload = () => {
                        currentTransform = { rotate: 0, flipX: 1, flipY: 1 };
                        document.getElementById('canvasWrapper').style.display = 'flex';
                        document.getElementById('controls').style.display = 'block';
                        applyRender();
                    };
                };
                reader.readAsDataURL(e.target.files[0]);
            }
        });

        document.querySelectorAll('.f-slider').forEach(slider => {
            slider.addEventListener('input', () => {
                document.getElementById(`v-${slider.id}`).innerText = slider.id === 'blur' ? `${slider.value}px` : (slider.id === 'hue' ? `${slider.value}°` : `${slider.value}%`);
                applyRender();
            });
        });

        window.transform = (type, val) => {
            if (type === 'rotate') currentTransform.rotate = (currentTransform.rotate + val) % 360;
            if (type === 'flipX') currentTransform.flipX *= -1;
            if (type === 'flipY') currentTransform.flipY *= -1;
            applyRender();
        };

        function applyRender() {
            const { rotate, flipX, flipY } = currentTransform;
            
            // Adjust canvas size for 90/270 degree rotations
            if (rotate % 180 !== 0) { canvas.width = img.height; canvas.height = img.width; } 
            else { canvas.width = img.width; canvas.height = img.height; }

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.rotate(rotate * Math.PI / 180);
            ctx.scale(flipX, flipY);

            // Apply Filters
            const b = document.getElementById('bright').value, c = document.getElementById('contrast').value;
            const s = document.getElementById('saturate').value, bl = document.getElementById('blur').value;
            const sp = document.getElementById('sepia').value, h = document.getElementById('hue').value;
            ctx.filter = `brightness(${b}%) contrast(${c}%) saturate(${s}%) blur(${bl}px) sepia(${sp}%) hue-rotate(${h}deg)`;

            ctx.drawImage(img, -img.width / 2, -img.height / 2);
            ctx.restore();
        }

        document.getElementById('downloadBtn').addEventListener('click', () => {
            const a = document.createElement('a');
            a.download = `Studio_${Date.now()}.png`;
            a.href = canvas.toDataURL('image/png');
            a.click();
        });
    </script>
</body>
</html>
