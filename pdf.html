<!DOCTYPE html>
<html lang="en" data-bs-theme="dark"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>PDF Manager - Toolkit</title><link rel="icon" type="image/svg+xml" href="logo.svg">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script></head>
<body><nav class="navbar navbar-expand-lg glass-navbar fixed-top"><div class="container-fluid"><a class="navbar-brand" href="index.html"><img src="logo.svg" alt="Toolkit Logo" style="width:35px;height:35px"> Toolkit</a></div></nav>
<main class="app-container"><div class="tool-header"><a href="index.html" class="back-btn" aria-label="Back"><i class="fa-solid fa-arrow-left"></i></a><div><h2 class="m-0">PDF Workspace</h2><small class="tool-subtitle">Preview, merge, extract, rotate, delete and insert pages</small></div></div>
<section class="tool-panel"><div class="privacy-note"><i class="fa-solid fa-shield-halved"></i> Your documents stay on this device.</div>
<div class="mode-tabs"><button class="mode-tab active" data-target="preview">PREVIEW</button><button class="mode-tab" data-target="merge">MERGE</button><button class="mode-tab" data-target="split">EXTRACT</button><button class="mode-tab" data-target="rotate">ROTATE</button><button class="mode-tab" data-target="delete">DELETE</button><button class="mode-tab" data-target="insert">INSERT</button></div>
<div id="preview" class="action-panel active"><label class="upload-zone" for="previewFile"><i class="fa-solid fa-file-pdf"></i><strong>Select a PDF to preview</strong><span>See every page before editing</span></label><input id="previewFile" type="file" accept="application/pdf" hidden><p id="meta" class="file-meta"></p><div id="pages" class="pdf-preview"></div></div>
<div id="merge" class="action-panel"><div class="input-group"><label>Select two or more PDF files</label><input id="mergeFiles" type="file" class="styled-input" accept="application/pdf" multiple></div><button id="mergeBtn" class="btn custom-btn w-100"><i class="fa-solid fa-object-group"></i> Merge documents</button></div>
<div id="split" class="action-panel"><div class="input-group"><label>Select a PDF</label><input id="splitFile" type="file" class="styled-input" accept="application/pdf"></div><div class="settings-grid"><div class="input-group"><label>First page</label><input id="first" class="styled-input" type="number" min="1" value="1"></div><div class="input-group"><label>Last page</label><input id="last" class="styled-input" type="number" min="1" value="1"></div></div><button id="splitBtn" class="btn custom-btn btn-secondary w-100"><i class="fa-solid fa-scissors"></i> Extract pages</button></div>
<div id="rotate" class="action-panel"><div class="input-group"><label>Select a PDF</label><input id="rotateFile" type="file" class="styled-input" accept="application/pdf"></div><div class="settings-grid"><div class="input-group"><label>Pages</label><input id="rotatePages" class="styled-input" value="all" placeholder="all or 1,3-5"></div><div class="input-group"><label>Rotation</label><select id="angle" class="styled-select"><option value="90">90° clockwise</option><option value="180">180°</option><option value="270">90° counter-clockwise</option></select></div></div><button id="rotateBtn" class="btn custom-btn w-100"><i class="fa-solid fa-rotate-right"></i> Rotate pages</button></div>
<div id="delete" class="action-panel"><div class="input-group"><label>Select a PDF</label><input id="deleteFile" type="file" class="styled-input" accept="application/pdf"></div><div class="input-group"><label>Pages to delete</label><input id="deletePages" class="styled-input" placeholder="Example: 2,4-6"></div><button id="deleteBtn" class="btn custom-btn btn-secondary w-100"><i class="fa-solid fa-trash"></i> Delete selected pages</button></div>
<div id="insert" class="action-panel"><div class="input-group"><label>Main PDF</label><input id="mainFile" type="file" class="styled-input" accept="application/pdf"></div><div class="input-group"><label>PDF pages to insert</label><input id="insertFile" type="file" class="styled-input" accept="application/pdf"></div><div class="input-group"><label>Insert after page</label><input id="insertAfter" class="styled-input" type="number" min="0" value="0"><small class="tool-subtitle">Use 0 to insert at the beginning.</small></div><button id="insertBtn" class="btn custom-btn w-100"><i class="fa-solid fa-file-circle-plus"></i> Insert PDF pages</button></div>
<p id="status" class="status-text" hidden></p><a id="download" class="btn custom-btn w-100 mt-3" hidden><i class="fa-solid fa-download"></i> Download exported PDF</a></section></main>
<script>pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const $=x=>document.getElementById(x), status=$('status'),download=$('download');let outUrl;function busy(t){status.hidden=false;status.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> '+t;download.hidden=true}function save(bytes,name){status.hidden=true;if(outUrl)URL.revokeObjectURL(outUrl);outUrl=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));download.href=outUrl;download.download=name;download.hidden=false}function base(f){return f.name.replace(/\.[^.]+$/,'')}
document.querySelectorAll('.mode-tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.mode-tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.action-panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.target).classList.add('active')});
$('previewFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;const box=$('pages');box.innerHTML='';$('meta').textContent='Loading preview…';try{const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;$('meta').textContent=`${f.name} · ${pdf.numPages} pages · ${(f.size/1048576).toFixed(2)} MB`;for(let n=1;n<=pdf.numPages;n++){const pg=await pdf.getPage(n),v=pg.getViewport({scale:.42}),c=document.createElement('canvas');c.width=v.width;c.height=v.height;await pg.render({canvasContext:c.getContext('2d'),viewport:v}).promise;const fig=document.createElement('figure');fig.className='pdf-page';fig.append(c,Object.assign(document.createElement('figcaption'),{textContent:'Page '+n}));box.append(fig)}}catch(e){$('meta').textContent='Could not preview this PDF.'}};
$('mergeBtn').onclick=async()=>{const fs=[...$('mergeFiles').files];if(fs.length<2)return alert('Select at least two PDFs.');busy('Merging your PDFs…');try{const result=await PDFLib.PDFDocument.create();for(const f of fs){const source=await PDFLib.PDFDocument.load(await f.arrayBuffer());(await result.copyPages(source,source.getPageIndices())).forEach(p=>result.addPage(p))}save(await result.save(),`merged_${base(fs[0])}.pdf`)}catch(e){status.hidden=true;alert('Could not merge these PDFs. Password-protected files are not supported.')}};
$('splitBtn').onclick=async()=>{const f=$('splitFile').files[0],a=+$('first').value,b=+$('last').value;if(!f)return alert('Select a PDF first.');busy('Extracting selected pages…');try{const source=await PDFLib.PDFDocument.load(await f.arrayBuffer()),total=source.getPageCount();if(a<1||b<a||b>total)throw Error(`Choose pages between 1 and ${total}.`);const result=await PDFLib.PDFDocument.create(),indices=Array.from({length:b-a+1},(_,i)=>a+i-1);(await result.copyPages(source,indices)).forEach(p=>result.addPage(p));save(await result.save(),`pages_${a}-${b}_${base(f)}.pdf`)}catch(e){status.hidden=true;alert(e.message)}};
function list(text,n){if(text.trim().toLowerCase()==='all')return [...Array(n).keys()];let s=new Set;text.split(',').forEach(q=>{let[a,b]=q.trim().split('-').map(Number);for(let i=a;i<=(b||a);i++)if(i>=1&&i<=n)s.add(i-1)});return [...s]}
$('rotateBtn').onclick=async()=>{const f=$('rotateFile').files[0];if(!f)return alert('Select a PDF first.');busy('Rotating selected pages…');try{const pdf=await PDFLib.PDFDocument.load(await f.arrayBuffer()),items=list($('rotatePages').value,pdf.getPageCount());if(!items.length)throw Error('Use all or page numbers such as 1,3-5.');items.forEach(i=>{let p=pdf.getPage(i);p.setRotation(PDFLib.degrees((p.getRotation().angle+(+$('angle').value))%360))});save(await pdf.save(),`rotated_${base(f)}.pdf`)}catch(e){status.hidden=true;alert(e.message)}};
$('deleteBtn').onclick=async()=>{const f=$('deleteFile').files[0];if(!f)return alert('Select a PDF first.');busy('Deleting selected pages…');try{const pdf=await PDFLib.PDFDocument.load(await f.arrayBuffer()),items=list($('deletePages').value,pdf.getPageCount()).sort((a,b)=>b-a);if(!items.length)throw Error('Enter pages to delete, such as 2,4-6.');if(items.length===pdf.getPageCount())throw Error('A PDF must keep at least one page.');items.forEach(i=>pdf.removePage(i));save(await pdf.save(),`edited_${base(f)}.pdf`)}catch(e){status.hidden=true;alert(e.message)}};
$('insertBtn').onclick=async()=>{const main=$('mainFile').files[0],extra=$('insertFile').files[0],after=+$('insertAfter').value;if(!main||!extra)return alert('Select both PDF files.');busy('Inserting PDF pages…');try{const pdf=await PDFLib.PDFDocument.load(await main.arrayBuffer()),addition=await PDFLib.PDFDocument.load(await extra.arrayBuffer());if(after<0||after>pdf.getPageCount())throw Error(`Use a page number from 0 to ${pdf.getPageCount()}.`);const copied=await pdf.copyPages(addition,addition.getPageIndices());copied.forEach((p,i)=>pdf.insertPage(after+i,p));save(await pdf.save(),`updated_${base(main)}.pdf`)}catch(e){status.hidden=true;alert(e.message)}};</script></body></html>
