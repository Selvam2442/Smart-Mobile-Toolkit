<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Password & Passphrase Generator | Smart Mobile Toolkit</title>
    <meta name="description" content="Generate ultra-strong passwords and memorable passphrases 100% offline using standard browser Web Cryptography API with live strength meter.">
    <meta name="keywords" content="password generator, passphrase generator, strong password tool, offline crypto password generator, password strength checker">
    <meta name="author" content="Smart Mobile Toolkit">
    
    <!-- Open Graph -->
    <meta property="og:title" content="Secure Password & Passphrase Generator | Smart Mobile Toolkit">
    <meta property="og:description" content="Generate ultra-strong passwords and memorable passphrases offline using standard Web Cryptography API.">
    <meta property="og:image" content="https://alaneditxz.online/Profile.png">
    <meta property="og:url" content="https://alaneditxz.online/password-generator.html">
    <meta property="og:type" content="website">

    <!-- Schema.org JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Secure Password & Passphrase Generator",
      "url": "https://alaneditxz.online/password-generator.html",
      "description": "Generate ultra-strong passwords and memorable passphrases offline using standard Web Cryptography API.",
      "applicationCategory": "UtilitiesApplication",
      "operatingSystem": "All",
      "offers": { "@type": "Offer", "price": "0" }
    }
    </script>

    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <!-- Custom Design System -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Modern Glass Navbar -->
    <nav class="navbar navbar-expand-lg glass-navbar fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html" aria-label="Smart Mobile Toolkit Home">
                <i class="bi bi-cpu-fill me-2 text-info"></i>Smart Toolkit
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="index.html"><i class="bi bi-grid-fill"></i> Tools</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html"><i class="bi bi-info-circle-fill"></i> About</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html"><i class="bi bi-envelope-fill"></i> Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content Container -->
    <main class="container my-5 pt-3">
        
        <!-- Header -->
        <div class="text-center mb-4">
            <h1 class="fw-bold text-white mb-2">Secure Password &amp; Passphrase Generator</h1>
            <p class="text-muted">Generate cryptographically strong passwords offline using native <code class="text-info">window.crypto</code>.</p>
        </div>

        <div class="row g-4 justify-content-center">
            <div class="col-lg-8">
                <div class="glass-card p-4">

                    <!-- Result Output Box -->
                    <div class="glass-panel p-3 mb-4 d-flex align-items-center justify-content-between position-relative">
                        <span id="passOutput" class="fs-4 font-monospace text-info me-3 text-break fw-bold">Select options below</span>
                        <div class="d-flex gap-2">
                            <button id="regenBtn" class="btn btn-outline-info rounded-circle px-3 py-2" title="Regenerate" aria-label="Regenerate password"><i class="bi bi-arrow-repeat fs-5"></i></button>
                            <button id="copyBtn" class="btn btn-info text-dark rounded-circle px-3 py-2 fw-bold" title="Copy" aria-label="Copy password"><i class="bi bi-clipboard-check fs-5"></i></button>
                        </div>
                    </div>

                    <!-- Strength Bar -->
                    <div class="mb-4">
                        <div class="d-flex justify-content-between text-muted small fw-bold mb-1">
                            <span>Password Strength</span>
                            <span id="strengthText" class="text-success">Strong</span>
                        </div>
                        <div class="progress" style="height: 8px; background: rgba(255,255,255,0.1);">
                            <div id="strengthBar" class="progress-bar bg-success" role="progressbar" style="width: 80%;" aria-label="Password strength meter"></div>
                        </div>
                    </div>

                    <!-- Mode Switcher -->
                    <ul class="nav nav-pills nav-justified mb-4 glass-panel p-1" id="modeTabs" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active rounded-pill text-white" id="random-tab" data-bs-toggle="pill" data-bs-target="#randomMode" type="button" role="tab" aria-selected="true"><i class="bi bi-key-fill me-2"></i>Random Password</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link rounded-pill text-white" id="phrase-tab" data-bs-toggle="pill" data-bs-target="#phraseMode" type="button" role="tab" aria-selected="false"><i class="bi bi-chat-quote-fill me-2"></i>Memorable Passphrase</button>
                        </li>
                    </ul>

                    <div class="tab-content" id="modeTabsContent">

                        <!-- Random Password Controls -->
                        <div class="tab-pane fade show active" id="randomMode" role="tabpanel">
                            <div class="mb-4">
                                <label for="passLen" class="form-label text-info fw-bold">Length: <span id="lenDisplay" class="badge bg-info text-dark ms-2">16</span></label>
                                <input type="range" id="passLen" class="form-range" min="8" max="64" value="16">
                            </div>

                            <div class="row g-3">
                                <div class="col-6">
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" id="optUpper" checked>
                                        <label class="form-check-label text-white" for="optUpper">Uppercase (A-Z)</label>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" id="optLower" checked>
                                        <label class="form-check-label text-white" for="optLower">Lowercase (a-z)</label>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" id="optNum" checked>
                                        <label class="form-check-label text-white" for="optNum">Numbers (0-9)</label>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" id="optSym" checked>
                                        <label class="form-check-label text-white" for="optSym">Symbols (!@#$)</label>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Passphrase Controls -->
                        <div class="tab-pane fade" id="phraseMode" role="tabpanel">
                            <div class="mb-4">
                                <label for="wordCount" class="form-label text-info fw-bold">Word Count: <span id="wordDisplay" class="badge bg-info text-dark ms-2">4</span></label>
                                <input type="range" id="wordCount" class="form-range" min="3" max="8" value="4">
                            </div>

                            <div class="row g-3">
                                <div class="col-6">
                                    <label for="separatorSelect" class="form-label text-muted small fw-bold">Word Separator</label>
                                    <select id="separatorSelect" class="form-select glass-input">
                                        <option value="-">Hyphen (-)</option>
                                        <option value="_">Underscore (_)</option>
                                        <option value=".">Period (.)</option>
                                        <option value=" ">Space ( )</option>
                                    </select>
                                </div>
                                <div class="col-6">
                                    <div class="form-check form-switch mt-4">
                                        <input class="form-check-input" type="checkbox" id="phraseCap" checked>
                                        <label class="form-check-label text-white" for="phraseCap">Capitalize Words</label>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>

                </div>
            </div>
        </div>
    </main>

    <footer>
        <p class="mb-0">&copy; 2026 Smart Mobile Toolkit. Generated locally using cryptographic security.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="global-search.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const passOutput = document.getElementById('passOutput');
            const regenBtn = document.getElementById('regenBtn');
            const copyBtn = document.getElementById('copyBtn');
            const strengthText = document.getElementById('strengthText');
            const strengthBar = document.getElementById('strengthBar');

            const passLen = document.getElementById('passLen');
            const lenDisplay = document.getElementById('lenDisplay');
            const optUpper = document.getElementById('optUpper');
            const optLower = document.getElementById('optLower');
            const optNum = document.getElementById('optNum');
            const optSym = document.getElementById('optSym');

            const wordCount = document.getElementById('wordCount');
            const wordDisplay = document.getElementById('wordDisplay');
            const separatorSelect = document.getElementById('separatorSelect');
            const phraseCap = document.getElementById('phraseCap');

            const randomTab = document.getElementById('random-tab');
            const phraseTab = document.getElementById('phrase-tab');

            let isPassphraseMode = false;

            const dictionary = [
                "quantum", "cyber", "galaxy", "orbit", "phoenix", "shadow", "beacon", "crypto",
                "nexus", "vertex", "matrix", "vector", "shield", "aurora", "comet", "nebula",
                "pulsar", "starlight", "horizon", "velocity", "zenith", "vortex", "solstice", "titan"
            ];

            randomTab.addEventListener('click', () => { isPassphraseMode = false; generate(); });
            phraseTab.addEventListener('click', () => { isPassphraseMode = true; generate(); });

            passLen.addEventListener('input', () => { lenDisplay.textContent = passLen.value; generate(); });
            wordCount.addEventListener('input', () => { wordDisplay.textContent = wordCount.value; generate(); });
            [optUpper, optLower, optNum, optSym, separatorSelect, phraseCap].forEach(el => el.addEventListener('change', generate));

            regenBtn.addEventListener('click', generate);

            copyBtn.addEventListener('click', () => {
                if (!passOutput.textContent) return;
                navigator.clipboard.writeText(passOutput.textContent).then(() => {
                    const originalHTML = copyBtn.innerHTML;
                    copyBtn.innerHTML = '<i class="bi bi-check-lg fs-5"></i>';
                    setTimeout(() => copyBtn.innerHTML = originalHTML, 1500);
                });
            });

            function getRandomInt(max) {
                const array = new Uint32Array(1);
                window.crypto.getRandomValues(array);
                return array[0] % max;
            }

            function generate() {
                if (isPassphraseMode) {
                    generatePassphrase();
                } else {
                    generateRandomPassword();
                }
            }

            function generateRandomPassword() {
                const u = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
                const l = "abcdefghijklmnopqrstuvwxyz";
                const n = "0123456789";
                const s = "!@#$%^&*()_+-=[]{}|;:,.<>?";

                let charSet = "";
                if (optUpper.checked) charSet += u;
                if (optLower.checked) charSet += l;
                if (optNum.checked) charSet += n;
                if (optSym.checked) charSet += s;

                if (!charSet) {
                    passOutput.textContent = "Select at least 1 option";
                    return;
                }

                const length = parseInt(passLen.value);
                let pass = "";
                for (let i = 0; i < length; i++) {
                    pass += charSet[getRandomInt(charSet.length)];
                }

                passOutput.textContent = pass;
                updateStrength(length, charSet.length);
            }

            function generatePassphrase() {
                const count = parseInt(wordCount.value);
                const sep = separatorSelect.value;
                const cap = phraseCap.checked;

                let words = [];
                for (let i = 0; i < count; i++) {
                    let w = dictionary[getRandomInt(dictionary.length)];
                    if (cap) w = w.charAt(0).toUpperCase() + w.slice(1);
                    words.push(w);
                }

                const pass = words.join(sep);
                passOutput.textContent = pass;
                updateStrength(pass.length, 52);
            }

            function updateStrength(len, poolSize) {
                const entropy = len * Math.log2(poolSize || 2);
                let pct = Math.min(100, Math.max(10, (entropy / 100) * 100));
                strengthBar.style.width = `${pct}%`;

                if (entropy < 40) {
                    strengthText.textContent = "Weak";
                    strengthText.className = "text-danger";
                    strengthBar.className = "progress-bar bg-danger";
                } else if (entropy < 70) {
                    strengthText.textContent = "Moderate";
                    strengthText.className = "text-warning";
                    strengthBar.className = "progress-bar bg-warning";
                } else {
                    strengthText.textContent = "Strong";
                    strengthText.className = "text-success";
                    strengthBar.className = "progress-bar bg-success";
                }
            }

            generate();
        });
    </script>
</body>
</html>
